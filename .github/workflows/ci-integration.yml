name: CI integration

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/warren?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install Atlas
        uses: ariga/setup-atlas@v0

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install Chrome for headless layout driver
        # ubuntu-latest doesn't ship chrome/chromium on PATH. The
        # layout driver needs a real CDP-capable browser binary to
        # drive the agent page across viewports; without it run.sh
        # silently exits 0 at the `no usable chrome/chromium binary`
        # guard. google-chrome-stable from dl.google.com is what
        # `apt-cache search ^google-chrome` resolves to on noble.
        run: |
          wget -qO /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb

      - name: Build
        run: cargo build --workspace

      - name: Schema drift (empty DB)
        run: cargo test -p warren --test schema_drift -- --ignored --nocapture

      - name: Schema drift (populated DB)
        run: cargo test -p warren --test schema_drift_populated -- --ignored --nocapture

      - name: OpenAPI drift
        run: cargo test -p warren --test openapi_drift -- --nocapture

      - name: Install Python deps for layout driver
        run: pip install --break-system-packages websocket-client

      - name: Install Claude Code CLI
        # The official upstream installer writes to ~/.local/bin.
        # run.sh uses `command -v claude` to detect, so this works
        # regardless of where the installer drops the binary. CI
        # has no subscription — claude still renders its default
        # first-run menu (the welcome / theme-picker banner), which
        # is exactly the structure the barrier-arrangement check
        # needs to fire against. We don't gate on auth.
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Layout integration (warren + browser + screenshots)
        run: ./tests/mobile-layout/run.sh

      - name: Upload mobile-layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-screenshots
          path: tests/mobile-layout/artifacts/

      - name: Warren test suite
        run: cargo test -p warren -- --test-threads=1
